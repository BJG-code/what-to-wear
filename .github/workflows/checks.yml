# Runs the automated checks on every pull request (and on main after a merge).
# The result shows as a ✅ or ❌ in the pull request's "Checks" tab.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the version check can compare with main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # A pull request that changes the app must also change its version number
      - if: github.event_name == 'pull_request'
        run: node tests/check-version.js origin/${{ github.base_ref }}
