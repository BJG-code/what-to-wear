<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit the phone screen, including the area around the iPhone notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Tells iPhone to use the dark colour behind the status bar and when "added to Home Screen" -->
  <meta name="theme-color" content="#0E0E12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="What to wear">
  <title>What to wear</title>

  <!-- Load Carlito from Google Fonts: the free fallback for Calibri, same shape -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --background: #0E0E12;
      --surface: #18181D;
      --border: #26262D;
      --purple: #7C3AED;
      --purple-hover: #6D28D9;
      --purple-light: #C4A7FF; /* accent text and icons on dark */
      --selected-tint: #231B36;
      --text: #F4F4F6;
      --muted: #A6A6B0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: var(--background);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      /* Keep content clear of the notch and home bar */
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background-color: var(--background);
      /* Calibri first; Carlito when the phone doesn't have Calibri */
      font-family: Calibri, "Carlito", sans-serif;
      font-size: 18px;
      line-height: 1.4;
      color: var(--text);
      /* Stop iPhone enlarging text when the phone is turned sideways */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    main {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Logo and tagline at the top */
    .logo h1 {
      line-height: 0;
    }

    .logo img {
      width: 240px;
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }

    .tagline {
      font-size: 0.875rem;
      color: var(--muted);
      margin-top: 4px;
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .label {
      display: block;
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    button,
    input {
      font: inherit;
      color: inherit;
    }

    .button {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      color: var(--purple-light);
      cursor: pointer;
    }

    .button:hover {
      background: var(--selected-tint);
    }

    /* Where you are */
    .location-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    #location-name {
      font-weight: 700;
    }

    #search {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #search-form {
      display: flex;
      gap: 8px;
    }

    #place {
      flex: 1;
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
    }

    #places {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #places button {
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
    }

    .link-button {
      align-self: flex-start;
      background: none;
      border: none;
      color: var(--purple-light);
      text-decoration: underline;
      cursor: pointer;
    }

    /* Choice buttons: running/cycling and how warm you feel */
    fieldset {
      border: none;
    }

    legend {
      padding: 0;
    }

    .choices {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .choices label {
      flex: 1;
      text-align: center;
      cursor: pointer;
    }

    .choices input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .choices span {
      display: block;
      padding: 10px 4px;
    }

    .choices label + label span {
      border-left: 1px solid var(--border);
    }

    .choices input:checked + span {
      background: var(--purple);
      color: #fff;
      font-weight: 700;
    }

    .choices label:hover input:not(:checked) + span {
      background: var(--selected-tint);
    }

    .choices label:hover input:checked + span {
      background: var(--purple-hover);
    }

    .choices input:focus-visible + span {
      outline: 2px solid var(--purple-light);
      outline-offset: -2px;
    }

    /* Weather and what to wear */
    #temperature {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1;
    }

    #conditions {
      color: var(--muted);
      margin-top: 6px;
    }

    #kit-heading {
      margin-top: 24px;
    }

    #kit {
      list-style: none;
      border-top: 1px solid var(--border);
    }

    #kit li {
      display: flex;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    #kit .area {
      flex: 0 0 56px;
      color: var(--muted);
    }

    #status {
      color: var(--muted);
    }

    footer {
      font-size: 0.875rem;
      color: var(--muted);
    }

    footer a {
      color: inherit;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main>
    <header class="logo">
      <h1><img src="assets/logo.png" alt="What to wear" width="1438" height="246"></h1>
      <p class="tagline">Whatever the weather, get it right</p>
    </header>

    <section aria-label="Location">
      <span class="label">Weather for</span>
      <div class="location-row">
        <span id="location-name">Finding your location…</span>
        <button type="button" class="button" id="change-location" aria-expanded="false" aria-controls="search">Change</button>
      </div>
      <div id="search" hidden>
        <form id="search-form" role="search">
          <input id="place" type="search" placeholder="Search for a town or city" aria-label="Town or city" autocomplete="off" enterkeyhint="search">
          <button type="submit" class="button">Search</button>
        </form>
        <ul id="places" aria-label="Matching places"></ul>
        <button type="button" class="link-button" id="use-device">Use my current location</button>
      </div>
    </section>

    <fieldset>
      <legend class="label">Activity</legend>
      <div class="choices">
        <label><input type="radio" name="activity" value="running" checked><span>Running</span></label>
        <label><input type="radio" name="activity" value="cycling"><span>Cycling</span></label>
      </div>
    </fieldset>

    <p id="status" role="status" hidden></p>

    <section id="results" aria-label="Weather and what to wear" hidden>
      <div>
        <p id="temperature"></p>
        <p id="conditions"></p>
      </div>
      <h2 id="kit-heading">Wear for your run</h2>
      <ul id="kit"></ul>
    </section>

    <fieldset>
      <legend class="label">I usually</legend>
      <div class="choices">
        <label><input type="radio" name="preference" value="cold"><span>Feel the cold</span></label>
        <label><input type="radio" name="preference" value="normal" checked><span>Feel normal</span></label>
        <label><input type="radio" name="preference" value="warm"><span>Run warm</span></label>
      </div>
    </fieldset>

    <footer>
      Weather data from <a href="https://open-meteo.com/">Open-Meteo</a>
    </footer>
  </main>

  <script src="clothing.js"></script>
  <script src="app.js"></script>
</body>
</html>
